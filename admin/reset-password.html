<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña - BAIT Prepago</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self';">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="/admin/admin.css">
  <meta name="robots" content="noindex, nofollow, noarchive">
</head>
<body class="login-body">
  <div class="login-background" aria-hidden="true">
    <div class="login-blob login-blob-yellow"></div>
    <div class="login-blob login-blob-dark"></div>
    <div class="login-dot-grid"></div>
  </div>

  <main class="login-shell">
    <div class="login-logo-wrap">
      <img src="/assets/bait-logo.svg" alt="BAIT" class="login-logo" />
    </div>

    <div class="login-card">
      <h1 class="login-title">Nueva contraseña</h1>
      <p class="login-subtitle">Ingresa tu nueva contraseña para acceder al panel de administración.</p>

      <div class="login-error" id="errorMessage" role="alert" hidden></div>
      <div class="login-success" id="successMessage" role="status" hidden></div>

      <form id="resetForm" class="login-form">
        
        <div class="login-field">
          <label for="password">Nueva contraseña</label>
          <div class="login-password-wrap">
            <input type="password" id="password" name="password" class="login-input" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required minlength="8">
            <button type="button" id="togglePasswordBtn" class="login-password-toggle" aria-label="Mostrar contraseña">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="login-field">
          <label for="passwordConfirm">Confirmar contraseña</label>
          <div class="login-password-wrap">
            <input type="password" id="passwordConfirm" name="passwordConfirm" class="login-input" placeholder="Confirma tu contraseña" autocomplete="new-password" required minlength="8">
            <button type="button" id="togglePasswordConfirmBtn" class="login-password-toggle" aria-label="Mostrar contraseña">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        
        <button type="submit" id="submitBtn" class="login-submit">
          <span class="login-spinner" id="submitSpinner" aria-hidden="true" hidden></span>
          <span id="submitText">Restablecer contraseña</span>
        </button>
      </form>

      <div class="login-recovery login-recovery-back">
        <a href="/admin/" class="login-recovery-btn login-recovery-link">Volver a iniciar sesión</a>
      </div>
    </div>
  </main>
  
  <script src="/admin/reset-password.js" type="module"></script>
</body>
</html>
