<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAIT Prepago - Admin Login</title>
  <!-- Security Headers (CSP) will be enforced via vercel.json, but adding meta as fallback/defense-in-depth -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self';">
  <link rel="stylesheet" href="/admin/admin.css">
  <meta name="robots" content="noindex, nofollow, noarchive">
</head>
<body class="login-body" id="loginBody">
  <!-- Fondo decorativo con apilamiento explícito -->
  <div class="login-background" aria-hidden="true">
    <div class="login-blob login-blob-yellow"></div>
    <div class="login-blob login-blob-dark"></div>
    <div class="login-dot-grid"></div>
  </div>

  <!-- Contenedor principal con visibilidad pendiente -->
  <main class="login-shell login-shell-pending" id="loginShell">
    <div class="login-logo-wrap">
      <img src="/assets/bait-logo.svg" alt="BAIT" class="login-logo" />
    </div>

    <div class="login-card">
      <h1 class="login-title">Iniciar sesión</h1>
      <p class="login-subtitle">Accede al panel de administración de BAIT Prepago</p>

      <div class="login-error" id="errorMessage" role="alert" hidden></div>

      <form id="loginForm" class="login-form">
        <div class="login-field">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" class="login-input" placeholder="tu@empresa.com" autocomplete="username" inputmode="email" required>
        </div>
        
        <div class="login-field">
          <label for="password">Contraseña</label>
          <div class="login-password-wrap">
            <input type="password" id="password" name="password" class="login-input" placeholder="Tu contraseña" autocomplete="current-password" required>
            <button type="button" id="togglePasswordBtn" class="login-password-toggle" aria-label="Mostrar contraseña">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Recuperación de contraseña -->
        <div class="login-recovery">
          <button type="button" id="forgotPasswordBtn" class="login-recovery-btn">¿Olvidaste tu contraseña?</button>
          <div id="recoveryMessage" class="login-recovery-message" role="status" aria-live="polite" hidden></div>
        </div>
        
        <button type="submit" id="submitBtn" class="login-submit">
          <span class="login-spinner" id="submitSpinner" aria-hidden="true" hidden></span>
          <span id="submitText">Entrar</span>
        </button>
      </form>
    </div>
  </main>
  
  <script src="/admin/login.js" type="module"></script>
</body>
</html>
