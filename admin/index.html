<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAIT Prepago - Admin Login</title>
  <!-- Security Headers (CSP) will be enforced via vercel.json, but adding meta as fallback/defense-in-depth -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self';">
  <link rel="stylesheet" href="/admin/admin.css">
  <meta name="robots" content="noindex, nofollow, noarchive">
</head>
<body class="login-body">
  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>BAIT Prepago</h1>
        <p>Administración</p>
      </div>
      <form id="loginForm" aria-live="polite">
        <div class="error-message" id="errorMessage" hidden></div>
        
        <div class="form-group">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        
        <button type="submit" id="submitBtn">Iniciar sesión</button>
      </form>
    </div>
  </main>
  <script src="/admin/login.js" type="module"></script>
</body>
</html>
