<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aceptar Invitación — BAIT Prepago</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-body">
  <div class="login-background" aria-hidden="true">
    <div class="login-blob login-blob-yellow"></div>
    <div class="login-blob login-blob-dark"></div>
    <div class="login-dot-grid"></div>
  </div>

  <main class="login-shell" id="loginShell">
    <div class="login-logo-wrap">
      <img src="/assets/bait-logo.svg" alt="BAIT" class="login-logo" />
    </div>

    <div class="login-card">
      <h1 class="login-title">Aceptar Invitación</h1>
      <p class="login-subtitle">Configura tu contraseña para acceder al panel de BAIT Prepago</p>

      <div class="login-error" id="errorMessage" role="alert" hidden></div>
      <div class="login-success" id="successMessage" role="alert" hidden style="color: var(--status-green); background: #e6ffed; padding: 12px; border-radius: 4px; margin-bottom: 24px; text-align: center;"></div>

      <form id="acceptForm" class="login-form">
        <div class="login-field">
          <label for="password">Contraseña</label>
          <div class="login-password-wrap">
            <input type="password" id="password" name="password" class="login-input" placeholder="Mínimo 8 caracteres" required minlength="8">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="login-submit">
          <span id="submitText">Configurar cuenta</span>
        </button>
      </form>
    </div>
  </main>
  
  <script src="/admin/accept-invite.js" type="module"></script>
</body>
</html>
