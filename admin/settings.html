<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración — BAIT Prepago Admin</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self';">
  <link rel="stylesheet" href="/admin/dashboard.css">
  <link rel="stylesheet" href="/admin/settings.css">
</head>
<body>

  <div id="appLoader" role="status" aria-live="polite" aria-label="Verificando sesión">
    <div class="loader-ring"></div>
  </div>

  <div id="sidebarOverlay" class="sidebar-overlay" role="presentation"></div>

  <div id="app" aria-hidden="true">

    <!-- ── Sidebar ──────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Menú principal">
      <div class="sidebar-brand" role="banner">
        <div class="sidebar-brand-logo" aria-hidden="true">
          <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <text x="3" y="15" font-size="14" font-weight="900" font-family="Inter,sans-serif">B</text>
          </svg>
        </div>
        <div>
          <div class="sidebar-brand-name">BAIT Prepago</div>
          <div class="sidebar-brand-sub">Panel administrativo</div>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Secciones">
        <div class="nav-section">
          <span class="nav-section-label">Principal</span>

          <a href="/admin/dashboard" class="nav-item" id="navResumen">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
            Resumen
          </a>

          <a href="/admin/leads" class="nav-item" id="navLeads">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Leads
          </a>

          <a href="/admin/analytics" class="nav-item" id="navAnalytics">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="20" x2="18" y2="10"/>
              <line x1="12" y1="20" x2="12" y2="4"/>
              <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
            Analítica
          </a>
        </div>

        <div class="sidebar-divider" role="separator"></div>

        <div class="nav-section">
          <span class="nav-section-label">Administración</span>
          <a href="/admin/users" class="nav-item" id="navUsers">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Usuarios
          </a>
          <a href="/admin/settings" class="nav-item" aria-current="page" id="navSettings">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Configuración
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-widget">
          <div class="user-avatar" id="userAvatar" aria-hidden="true">?</div>
          <div class="user-meta">
            <div class="user-email" id="userEmail">—</div>
            <div class="user-role" id="userRole">—</div>
          </div>
          <button id="logoutBtn" class="btn-logout-sidebar" title="Cerrar sesión" aria-label="Cerrar sesión">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- ── Main area ──────────────────────────────────────────── -->
    <div class="main-area">
      <header class="topbar" role="banner">
        <button id="hamburgerBtn" class="hamburger-btn" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="topbar-title-wrap">
          <h1 class="topbar-title">Configuración</h1>
          <p class="topbar-sub">Ajustes de cuenta</p>
        </div>
      </header>

      <main class="page-body" id="pageBody">
        <div class="sr-only" role="status" aria-live="polite" id="statusLive"></div>

        <section class="card settings-card" aria-labelledby="securityHeading">
          <div class="card-header">
            <div>
              <h2 class="card-title" id="securityHeading">Seguridad</h2>
              <p class="card-subtitle">Cambia tu contraseña. Se cerrarán todas tus sesiones activas.</p>
            </div>
          </div>
          <div class="card-body">
            <form id="passwordForm" class="settings-form">
              <div id="pwdAlertBox" class="alert-box" style="display:none;" role="alert"></div>
              
              <div class="form-group">
                <label for="currentPassword">Contraseña Actual</label>
                <input type="password" id="currentPassword" required>
              </div>
              
              <div class="form-group">
                <label for="newPassword">Nueva Contraseña</label>
                <input type="password" id="newPassword" required minlength="8" placeholder="Mínimo 8 caracteres">
              </div>

              <div class="form-group">
                <label for="confirmPassword">Confirmar Nueva Contraseña</label>
                <input type="password" id="confirmPassword" required minlength="8">
              </div>

              <div class="form-actions">
                <button type="submit" class="btn-primary" id="submitPwdBtn">Actualizar contraseña</button>
              </div>
            </form>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/admin/settings.js" type="module"></script>
</body>
</html>
